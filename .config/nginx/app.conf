# =====================================================
# Redirect HTTP → HTTPS (only for your domain)
# =====================================================
server {
    listen 80;
    server_name app.sayone.team;

    # Allow certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# Deny all other HTTP requests (IP or invalid hosts)
# =====================================================
server {
    listen 80 default_server;
    server_name _;
    return 403;  # Forbidden for IP access
}

# =====================================================
# HTTPS Server Block (actual app)
# =====================================================
server {
    listen 443 ssl http2;
    server_name app.sayone.team;
    # Allow only valid domain access
    if ($host != "app.sayone.team") {
        return 444;  # drop connection
    }

    # SSL certificates
    ssl_certificate     /etc/letsencrypt/live/app.sayone.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sayone.team/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    charset utf-8;
    client_max_body_size 75M;

    # uWSGI upstream
    location / {
        include uwsgi_params;
        uwsgi_pass web:8000;
    }

    # Static files
    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    # Security hardening
    location ~* \.(php|pl|rb|jsp|asp|aspx|cgi)$ { return 403; }
    location ~* \.(sh|exe|dll|bat|cmd|com|scr|jar|war|ps1|msi|vbs|sql|bak|old|config|log)$ { return 403; }
    location ~* "(wp-admin|wp-content|xmlrpc\.php|phpmyadmin|eval-stdin\.php)" { return 444; }
    location ~* \.(inc|ini|swp|dist|yaml|yml|toml)$ { return 403; }
}
