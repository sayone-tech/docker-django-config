# Upstream configuration for uwsgi
upstream uwsgi {
  server web:8000; # use TCP
}

# Redirect HTTP to HTTPS
server {
  listen    80;
  server_name app.sayone.team;
  return 301 https://$host$request_uri;
  server_tokens off;
  charset     utf-8;
  client_max_body_size 75M;
}

# Main HTTPS server block
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name app.sayone.team;
  server_tokens off;
  charset     utf-8;
  client_max_body_size 75M;

  # SSL certificate paths
  ssl_certificate /etc/nginx/ssl/live/app.sayone.team/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/app.sayone.team/privkey.pem;

  # Client upload limit
  client_max_body_size 3M;

  # Allow domain verification for Certbot
  location /.well-known/acme-challenge/ {
    allow all;
    root /var/www/certbot;
  }

  # Block access to hidden files (e.g., .env, .git, .htaccess)
  location ~ /\.(?!well-known).* {
    deny all;
    return 403;
  }

  # Block access to PHP files (if not used in your project)
  location ~ \.php$ {
    deny all;
    return 403;
  }

  # Deny invalid Host header requests
  if ($host != "app.sayone.team") {
    return 403;
  }

  # Proxy valid requests to uwsgi
  location / {
    uwsgi_pass uwsgi;
    include /etc/nginx/uwsgi_params;
  }
}

# Default server to handle requests with no matching server_name
server {
  listen    80 default_server; # Default server for IP address requests
  server_name _;               # Catch-all server block
  server_tokens off;

  # Block all direct access by IP
  location / {
    deny all;
    return 403;
  }
}
